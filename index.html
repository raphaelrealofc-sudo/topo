<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFL•★•REAL | Avakin Life Social House</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050505;
            overflow: hidden;
            position: relative;
        }

        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Cartão de Vidro */
        .glass-card {
            position: relative;
            z-index: 1;
            padding: 4rem 5rem;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .top-phrase {
            font-size: 0.8rem;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 0.5rem;
            display: block;
            animation: pulse-text 2s infinite ease-in-out;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        @keyframes pulse-text {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        .brand-icon { font-size: 1.5rem; color: #fff; margin-bottom: 0.5rem; opacity: 0.8; }

        h1 {
            font-size: 4.5rem;
            font-weight: 900;
            background: linear-gradient(180deg, #fff 0%, #888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            margin-bottom: 0.2rem;
        }

        .tagline {
            font-size: 1.1rem;
            font-weight: 300;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 14px;
            margin-bottom: 3.5rem;
            opacity: 0.9;
        }

        .btn-enter {
            display: inline-block;
            padding: 1.2rem 4rem;
            background: #fff;
            color: #000;
            text-decoration: none;
            font-weight: 700;
            border-radius: 8px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            transition: 0.4s ease;
            text-transform: uppercase;
        }

        .btn-enter:hover {
            background: transparent;
            color: #fff;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
            border: 1px solid #fff;
        }

        .footer {
            position: absolute;
            bottom: 30px;
            text-align: center;
            z-index: 10;
        }

        .social-link {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 0.7rem;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .social-link:hover { color: #fff; }
    </style>
</head>
<body>
    
    <div id="header-placeholder"></div>

    <div id="particles-js"></div>

    <div class="glass-card">
        <span class="top-phrase">Avakin Life Social House</span>
        <div class="brand-icon">✦</div>
        <h1>RFL•★•REAL</h1>
        <p class="tagline">BEM-VINDO AO TOPO</p>
        
        <a href="social.html" class="btn-enter">ENTRAR</a>
    </div>

    <div class="footer">
        <a href="https://instagram.com/raphael_real_ofc" class="social-link" target="_blank">INSTAGRAM @RAPHAEL_REAL_OFC</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        // Inicia Partículas
        particlesJS('particles-js', {
            "particles": {
                "number": { "value": 50, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#ffffff" },
                "opacity": { "value": 0.2 },
                "size": { "value": 2, "random": true },
                "line_linked": { "enable": false },
                "move": { "enable": true, "speed": 1 }
            }
        });

       fetch('cabecalho/head.html') // Caminho limpo, sem acentos
    .then(response => {
        if (!response.ok) throw new Error('Erro na conexão: ' + response.status);
        return response.text();
    })
    .then(data => {
        document.getElementById('header-placeholder').innerHTML = data;
        console.log('O cabeçalho do RFL foi carregado!');
    })
    .catch(error => {
        console.error('Erro ao carregar cabeçalho:', error);
    });
    </script>

</body>
</html>
