<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFL•★•REAL | Official Enterprise</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050505;
            overflow: hidden;
            position: relative;
        }

        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Navegação Superior Empresarial */
        .top-nav {
            position: absolute;
            top: 30px;
            display: flex;
            gap: 40px;
            z-index: 10;
        }

        .top-nav a {
            color: rgba(255, 255, 255, 0.4);
            text-decoration: none;
            font-size: 0.7rem;
            letter-spacing: 3px;
            font-weight: 400;
            transition: 0.3s;
        }

        .top-nav a:hover { color: #fff; }

        /* Cartão de Vidro Premium */
        .glass-card {
            position: relative;
            z-index: 1;
            padding: 5rem;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            overflow: hidden; /* Para o brilho não sair das bordas */
        }

        /* Efeito Shimmer (Brilho de Diamante) */
        .glass-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.08), transparent);
            transform: skewX(-25deg);
            animation: shimmer 4s infinite;
        }

        @keyframes shimmer { 100% { left: 150%; } }

        /* Branding RFL•★•REAL */
        .brand-icon { font-size: 1.5rem; color: #fff; margin-bottom: 1rem; opacity: 0.7; }

        h1 {
            font-size: 4.5rem;
            font-weight: 900;
            background: linear-gradient(180deg, #fff 0%, #888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            margin-bottom: 0.2rem;
        }

        .tagline {
            font-size: 1.1rem;
            font-weight: 300;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 14px;
            margin-bottom: 1rem;
            opacity: 0.9;
        }

        .slogan {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 3.5rem;
        }

        /* Botão Corporate */
        .btn-enter {
            display: inline-block;
            padding: 1.2rem 4rem;
            background: #fff;
            color: #000;
            text-decoration: none;
            font-weight: 700;
            border-radius: 8px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            transition: 0.4s ease;
        }

        .btn-enter:hover {
            background: transparent;
            color: #fff;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
            border: 1px solid #fff;
        }

        /* Rodapé Social */
        .footer {
            position: absolute;
            bottom: 30px;
            text-align: center;
            z-index: 10;
        }

        .social-link {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 0.7rem;
            letter-spacing: 2px;
            transition: 0.3s;
        }

        .social-link:hover { color: #fff; }

        .copyright {
            margin-top: 15px;
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
        }

        /* Animação de Entrada */
        .glass-card { animation: fadeIn 1.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

<div id="particles-js"></div>

<nav class="top-nav">
    <a href="#">SOLUÇÕES</a>
    <a href="#">PORTFÓLIO</a>
    <a href="#">CONTATO</a>
</nav>

<div class="glass-card">
    <div class="brand-icon">✦</div>
    <h1>RFL•★•REAL</h1>
    <p class="tagline">BEM-VINDO AO TOPO</p>
    <p class="slogan">Excelência Digital e Gestão de Alta Performance</p>
    
    <a href="#" class="btn-enter">ACESSAR ECOSSISTEMA</a>
</div>

<div class="footer">
    <a href="https://instagram.com/raphael_real_ofc" class="social-link" target="_blank">INSTAGRAM @RAPHAEL_REAL_OFC</a>
    <p class="copyright">© 2026 RFL•★•REAL • TODOS OS DIREITOS RESERVADOS</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
<script>
    particlesJS('particles-js', {
        "particles": {
            "number": { "value": 60, "density": { "enable": true, "value_area": 800 } },
            "color": { "value": "#ffffff" },
            "opacity": { "value": 0.2 },
            "size": { "value": 2, "random": true },
            "line_linked": { "enable": false },
            "move": { "enable": true, "speed": 0.8, "direction": "none", "random": true, "out_mode": "out" }
        },
        "interactivity": { "events": { "onhover": { "enable": true, "mode": "bubble" } }, "modes": { "bubble": { "size": 4, "opacity": 1 } } }
    });
</script>

</body>
</html>
