<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOPO | RFL•★•REAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d4ff;
            --admin-gold: #ffd700;
            --bg-dark: #050505;
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }
        body { background: var(--bg-dark); color: white; font-family: 'Montserrat', sans-serif; }

        /* NAVBAR */
        .navbar {
            position: fixed; top: 0; width: 100%; padding: 15px 30px;
            background: rgba(5, 5, 5, 0.95); backdrop-filter: blur(15px);
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000; border-bottom: 2px solid var(--primary);
        }
        .nav-logo { font-weight: 900; color: var(--primary); text-decoration: none; font-size: 1.4rem; }

        /* MAIN CONTENT */
        #main-content { padding: 100px 20px 50px; max-width: 1500px; margin: auto; }
        .main-grid { display: grid; grid-template-columns: 320px 1fr 320px; gap: 20px; }

        .panel { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
        h2 { font-size: 1rem; color: var(--primary); margin-bottom: 15px; text-transform: uppercase; }

        /* STATUS TAGS */
        .tag { font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; font-weight: bold; margin-right: 5px; }
        .tag-dono { background: var(--admin-gold); color: black; }
        .tag-lenda { background: var(--primary); color: black; }
        .tag-membro { background: #555; color: white; }

        /* CALCULADORA */
        .calc-input { width: 100%; padding: 10px; background: #111; border: 1px solid #333; color: white; border-radius: 8px; margin-bottom: 10px; }
        .btn { background: var(--primary); border: none; padding: 12px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 8px; color: black; transition: 0.3s; }
        .btn:hover { filter: brightness(1.2); box-shadow: 0 0 15px var(--primary); }

        /* CHAT MESSAGES */
        .chat-msg { margin-bottom: 12px; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 8px; border-left: 3px solid var(--primary); }

        @media (max-width: 1100px) { .main-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="nav-logo">RFL•★•REAL <span style="font-size: 0.7rem; color: var(--admin-gold);">[DONO]</span></a>
    </nav>

    <main id="main-content">
        <div class="main-grid">
            
            <aside>
                <div class="panel">
                    <h2>💎 Calculadora de Metas</h2>
                    <p style="font-size: 0.75rem; margin-bottom: 10px; opacity: 0.7;">Quanto tempo falta para o seu item?</p>
                    <input type="number" id="preco-item" class="calc-input" placeholder="Preço do Item (Avacoins)">
                    <input type="number" id="ganho-diario" class="calc-input" placeholder="Ganho por Dia">
                    <button class="btn" onclick="calcularMeta()">CALCULAR DIAS</button>
                    <p id="resultado-meta" style="margin-top: 15px; font-weight: bold; color: var(--admin-gold); text-align: center;"></p>
                </div>

                <div class="panel">
                    <h2>🏆 Top Ranking</h2>
                    <div style="margin-bottom: 10px;"><span class="tag tag-dono">DONO</span> <b>RFL•★•REAL</b></div>
                    <div style="margin-bottom: 10px;"><span class="tag tag-lenda">LENDA</span> Membro_Ativo</div>
                    <div style="margin-bottom: 10px;"><span class="tag tag-membro">NOVO</span> Visitante_XYZ</div>
                </div>
            </aside>

            <section class="panel">
                <h2>📸 Mural de Estilos</h2>
                <textarea id="post-input" class="calc-input" rows="3" placeholder="Poste seu link de imagem ou recado..."></textarea>
                <button class="btn" onclick="enviarPost()">PUBLICAR NO TOPO</button>
                <div id="feed-mural" style="margin-top: 25px;">
                    </div>
            </section>

            <aside class="panel">
                <h2>💬 Chat com Status</h2>
                <div id="chat-box" style="height: 400px; overflow-y: auto; margin-bottom: 15px;">
                    <div class="chat-msg"><span class="tag tag-dono">DONO</span> <b>RFL•★•REAL:</b> Sejam bem-vindos ao TOPO!</div>
                </div>
                <input type="text" id="chat-input" class="calc-input" placeholder="Sua mensagem...">
                <button class="btn" onclick="enviarChat()">ENVIAR</button>
            </aside>

        </div>
    </main>

    <script>
        // FUNÇÃO DA CALCULADORA
        function calcularMeta() {
            const preco = document.getElementById('preco-item').value;
            const ganho = document.getElementById('ganho-diario').value;
            const res = document.getElementById('resultado-meta');

            if(preco > 0 && ganho > 0) {
                const dias = Math.ceil(preco / ganho);
                res.innerHTML = `Faltam ${dias} dias para a sua conquista! 🚀`;
            } else {
                res.innerHTML = "Insira valores válidos!";
            }
        }

        // SIMULAÇÃO DE SISTEMA DE STATUS (Para o Chat)
        function enviarChat() {
            const input = document.getElementById('chat-input');
            const box = document.getElementById('chat-box');
            if(input.value) {
                // Aqui simulamos um membro enviando
                box.innerHTML += `<div class="chat-msg"><span class="tag tag-membro">MEMBRO</span> <b>Membro:</b> ${input.value}</div>`;
                input.value = "";
                box.scrollTop = box.scrollHeight;
            }
        }

        function enviarPost() {
            alert("Sistema de postagem ativo! Conecte ao seu Firebase para salvar permanentemente.");
        }
    </script>
</body>
</html>
