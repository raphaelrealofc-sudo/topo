<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFL•★•REAL | Official Site</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050505; /* Fundo ultra escuro profissional */
            overflow: hidden;
            perspective: 1000px;
        }

        /* Fundo dinâmico com luzes suaves para efeito de profundidade */
        .background-blobs {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
            filter: blur(80px);
        }

        .blob {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(103, 61, 230, 0.15); /* Roxo Hostinger sutil */
            animation: move 15s infinite alternate ease-in-out;
        }

        @keyframes move {
            from { transform: translate(-10%, -10%); }
            to { transform: translate(100%, 80%); }
        }

        /* Efeito Vidro (Glassmorphism) */
        .glass-card {
            position: relative;
            z-index: 1;
            padding: 4rem 5rem;
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(25px); /* Desfoco intenso de vidro */
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        /* Marca RFL•★•REAL */
        h1 {
            font-size: 4.5rem;
            font-weight: 900;
            background: linear-gradient(180deg, #ffffff 0%, #a1a1a1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -2px;
            margin-bottom: 0.5rem;
            animation: pulse-glow 3s infinite ease-in-out;
        }

        /* Frase Bem-vindo ao Topo */
        .tagline {
            font-size: 1.5rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.7);
            text-transform: uppercase;
            letter-spacing: 8px;
            margin-bottom: 3rem;
            animation: pulse-glow 3s infinite ease-in-out 0.5s;
        }

        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); opacity: 1; filter: brightness(1); }
            50% { transform: scale(1.02); opacity: 0.8; filter: brightness(1.3); }
        }

        /* Botão Entrar Minimalista */
        .btn-enter {
            display: inline-block;
            padding: 1rem 3.5rem;
            background: #ffffff;
            color: #000000;
            text-decoration: none;
            font-weight: 700;
            border-radius: 12px;
            font-size: 1.1rem;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid transparent;
        }

        .btn-enter:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
            background: transparent;
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.5);
        }

        /* Responsividade */
        @media (max-width: 768px) {
            h1 { font-size: 2.8rem; }
            .tagline { font-size: 1rem; letter-spacing: 4px; }
            .glass-card { padding: 3rem 2rem; width: 90%; }
        }
    </style>
</head>
<body>

    <div class="background-blobs">
        <div class="blob"></div>
    </div>

    <div class="glass-card">
        <h1>RFL•★•REAL</h1>
        <p class="tagline">Bem-vindo ao Topo</p>
        <a href="seu-link-aqui.html" class="btn-enter">ENTRAR</a>
    </div>

</body>
</html>
