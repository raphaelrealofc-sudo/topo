<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFL•★•REAL | Bem-vindo ao Topo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');

        body {
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            overflow: hidden; /* Para garantir que o efeito de blur funcione */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460); /* Fundo com gradiente noturno */
            color: #ecf0f1; /* Cor de texto clara */
            position: relative;
        }

        /* Efeito de background com foco e desfoco (simulação com gradiente sutil) */
        body::before {
            content: '';
            position: absolute;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            background: radial-gradient(circle at 20% 80%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.1) 0%, transparent 50%);
            animation: backgroundPan 20s infinite alternate linear;
            filter: blur(5px); /* Efeito de desfoco */
            z-index: 0;
        }

        @keyframes backgroundPan {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }

        .content-wrapper {
            position: relative;
            z-index: 1; /* Garante que o conteúdo esteja acima do background */
            text-align: center;
            background: rgba(0, 0, 0, 0.4); /* Fundo semi-transparente para o conteúdo */
            padding: 3rem 4rem;
            border-radius: 20px;
            backdrop-filter: blur(8px); /* Blur para o conteúdo */
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            animation: fadeIn 2s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            font-size: 5rem; /* Nome da marca bem grande */
            color: #ff8b15; /* Cor de destaque Hostinger */
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(255, 139, 21, 0.7);
            animation: pulse 2s infinite alternate ease-in-out;
        }

        .tagline {
            font-size: 2rem; /* Frase de boas-vindas destacada */
            color: #ecf0f1;
            margin-top: 0;
            margin-bottom: 2rem;
            letter-spacing: 1px;
            animation: pulse 2s infinite alternate ease-in-out 0.5s; /* Pulsação com delay */
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.95; }
            100% { transform: scale(1); opacity: 1; }
        }

        .btn-enter {
            display: inline-block;
            padding: 15px 40px;
            background-color: #673de6; /* Cor roxa da Hostinger */
            color: white;
            text-decoration: none;
            border-radius: 50px; /* Botão arredondado */
            font-weight: bold;
            font-size: 1.3rem;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-enter:hover {
            background-color: #5a2eca;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        /* Responsividade básica */
        @media (max-width: 768px) {
            h1 { font-size: 3rem; }
            .tagline { font-size: 1.5rem; }
            .content-wrapper { padding: 2rem; }
            .btn-enter { padding: 12px 30px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="content-wrapper">
        <h1>RFL•★•REAL</h1>
        <p class="tagline">Bem-vindo ao Topo</p>
        <a href="#" class="btn-enter">Entrar</a>
    </div>

</body>
</html>
