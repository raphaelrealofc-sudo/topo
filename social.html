<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social | RFL•★•REAL</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: #050505;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            /* Espaço para o cabeçalho modular fixo */
            padding-top: 120px; 
        }

        /* Container do Cabeçalho vindo do head.html */
        #header-placeholder {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10000;
        }

        #particles-js {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Conteúdo Social */
        .social-container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            width: 100%;
            padding: 40px 20px;
            text-align: center;
        }

        .main-title {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 10px;
            letter-spacing: -1px;
            background: linear-gradient(180deg, #fff 0%, #666 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub-title {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 50px;
        }

        /* Grade de Conexões */
        .hub-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .hub-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            padding: 30px;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-decoration: none;
            color: white;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .hub-item:hover {
            transform: scale(1.05);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
        }

        .hub-item span { 
            font-size: 2rem; 
            margin-bottom: 15px; 
            display: block; 
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.3));
        }

        .hub-item h4 { 
            font-size: 1.1rem; 
            margin-bottom: 8px; 
            letter-spacing: 1px; 
            font-weight: 700;
        }

        .hub-item p { 
            font-size: 0.75rem; 
            color: rgba(255, 255, 255, 0.4); 
            line-height: 1.4; 
        }

        @media (max-width: 600px) {
            .main-title { font-size: 2.2rem; }
            .sub-title { letter-spacing: 2px; font-size: 0.8rem; }
            body { padding-top: 150px; }
        }
    </style>
</head>
<body>

    <div id="header-placeholder"></div>

    <div id="particles-js"></div>

    <div class="social-container">
        <h1 class="main-title">O Coração do Ecossistema</h1>
        <p class="sub-title">Avakin Life Social House</p>

        <div class="hub-grid">
            <a href="#" class="hub-item">
                <span>👥</span>
                <h4>Comunidade</h4>
                <p>Conecte-se com membros da Social House e participe da elite.</p>
            </a>

            <a href="https://instagram.com/raphael_real_ofc" target="_blank" class="hub-item">
                <span>📸</span>
                <h4>Instagram Oficial</h4>
                <p>Acompanhe o dia a dia e as atualizações da marca em tempo real.</p>
            </a>

            <a href="#" class="hub-item">
                <span>💎</span>
                <h4>Exclusividades</h4>
                <p>Acesso a conteúdos e eventos restritos ao topo da pirâmide.</p>
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        particlesJS('particles-js', {
            "particles": {
                "number": { "value": 40, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#ffffff" },
                "opacity": { "value": 0.1 },
                "size": { "value": 1 },
                "line_linked": { "enable": true, "distance": 150, "color": "#ffffff", "opacity": 0.05, "width": 1 },
                "move": { "enable": true, "speed": 0.5 }
            }
        });

        // LIGAÇÃO COM O CABEÇALHO MODULAR
        fetch('cabecalho/head.html')
            .then(response => {
                if (!response.ok) throw new Error('Não foi possível carregar o head.html');
                return response.text();
            })
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
            })
            .catch(error => {
                console.error('Erro na integração do cabeçalho:', error);
            });
    </script>

</body>
</html>
