<style>
    /* Configuração do Cabeçalho Principal */
    .main-header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        padding: 20px 50px;
        display: grid;
        grid-template-columns: 1fr auto 1fr; /* Garante centralização perfeita da frase */
        align-items: center;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        z-index: 9999;
    }

    /* Nome RFL Pulsante */
    .brand-hub {
        font-weight: 900;
        letter-spacing: 3px;
        font-size: 1.1rem;
        color: #fff;
        text-transform: uppercase;
        animation: pulseName 2s infinite ease-in-out;
    }

    /* Frase Central Pulsante */
    .center-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
    }

    .center-phrase {
        font-size: 0.9rem;
        letter-spacing: 4px;
        text-transform: uppercase;
        color: #ffffff;
        font-weight: 400;
        animation: pulseText 3s infinite ease-in-out;
    }

    /* Linha Pulsante Neon */
    .pulse-line {
        width: 100px;
        height: 2px;
        background: #00ff88;
        box-shadow: 0 0 15px #00ff88;
        border-radius: 2px;
        animation: pulseLine 2s infinite alternate ease-in-out;
    }

    /* Status à Direita */
    .status-container {
        display: flex;
        justify-content: flex-end;
    }

    .status-online {
        font-size: 0.65rem;
        letter-spacing: 2px;
        color: #00ff88;
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
    }

    .dot {
        width: 8px;
        height: 8px;
        background: #00ff88;
        border-radius: 50%;
        box-shadow: 0 0 10px #00ff88;
        animation: blink 1.5s infinite;
    }

    /* --- ANIMAÇÕES --- */

    /* Pulsação do Nome e Frase */
    @keyframes pulseName {
        0%, 100% { transform: scale(1); opacity: 1; text-shadow: 0 0 0px #fff; }
        50% { transform: scale(1.02); opacity: 0.7; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
    }

    @keyframes pulseText {
        0%, 100% { opacity: 1; filter: blur(0px); }
        50% { opacity: 0.5; filter: blur(0.5px); }
    }

    /* Pulsação da Linha (Expansão e Brilho) */
    @keyframes pulseLine {
        0% { width: 40px; opacity: 0.3; box-shadow: 0 0 5px #00ff88; }
        100% { width: 120px; opacity: 1; box-shadow: 0 0 20px #00ff88; }
    }

    @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
    }

    /* Ajuste Mobile */
    @media (max-width: 768px) {
        .main-header { 
            padding: 15px 20px; 
            grid-template-columns: 1fr; 
            gap: 15px;
            text-align: center;
        }
        .status-container { justify-content: center; }
        .center-phrase { font-size: 0.75rem; letter-spacing: 2px; }
        .pulse-line { width: 80px; }
    }
</style>

<header class="main-header">
    <div class="brand-hub">RFL•★•SOCIAL</div>
    
    <div class="center-content">
        <div class="center-phrase">Avakin Life Social House</div>
        <div class="pulse-line"></div>
    </div>

    <div class="status-container">
        <div class="status-online">
            <div class="dot"></div> HUB ATIVO
        </div>
    </div>
</header>
